[build]
  publish = "dist"
  command = "vite build"

# ─── Cache headers for static assets ──────────────────────────────────────────

# Hashed JS/CSS assets (immutable — Vite adds content hashes)
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Images (1 week cache)
[[headers]]
  for = "*.webp"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "*.png"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "*.jpg"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# Video assets (1 week cache)
[[headers]]
  for = "*.mp4"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "*.webm"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# SVG files
[[headers]]
  for = "*.svg"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# Font files
[[headers]]
  for = "*.woff2"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# ─── Redirects ────────────────────────────────────────────────────────────────

# Proxy /studio to the Sanity-hosted studio
[[redirects]]
  from = "/studio/*"
  to = "https://ambalan.sanity.studio/:splat"
  status = 200
  force = true

# Main app routing
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  force = false
